# Local Postgres for `make dev` and `make test`.
# `docker compose --profile full up` also runs the API and the web app in containers.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jagalink
      POSTGRES_PASSWORD: jagalink
      POSTGRES_DB: jagalink
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jagalink -d jagalink"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: [full]
    build: ./backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://jagalink:jagalink@db:5432/jagalink
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: [full]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
